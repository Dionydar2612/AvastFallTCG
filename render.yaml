# Render Blueprint: เว็บเดียวรวมทุกอย่าง (เกมทดลองเล่น + Card List + card-api + /admin + ข้อเสนอแนะ)
services:
  - type: web
    name: avastfall-tcg
    runtime: node
    plan: starter                 # Persistent Disk ใช้ได้เฉพาะแพ็กเกจที่เสียเงิน
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: avastfall-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR             # เก็บเฉพาะ feedback.json / updates.json (การ์ดและผู้ใช้อยู่ใน Supabase · รูปการ์ดอยู่ในโค้ด public/images)
        value: /var/data
      - key: SUPABASE_URL        # ฐานข้อมูลผู้ใช้ + ข้อมูลการ์ด (ดู supabase/schema.sql)
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS        # อีเมลแอดมิน คั่นด้วย ,
        sync: false
      - key: ADMIN_KEY            # รหัสเปิด /recommece?key=...  (Render สุ่มให้ ดูได้ที่ Dashboard > Environment)
        generateValue: true
      - key: RESEND_API_KEY       # คีย์จาก resend.com สำหรับอีเมลสำเนาข้อเสนอแนะ (ไม่ใส่ = ไม่ส่งอีเมล)
        sync: false
      - key: NOTIFY_EMAIL
        value: saknarinnumber8@gmail.com
