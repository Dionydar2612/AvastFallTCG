<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เข้าสู่ระบบ · AvastFall TCG</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#fbfbf7;--panel:#fff;--ink:#111;--ink2:#666;--line:#111;--rule:#bfe3ea;--gold:#ffc20e;--bad:#c0121f;--good:#1a8a3a;--r:14px;--sh:4px 4px 0 var(--line);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15171a;--panel:#22252a;--ink:#f2f2f2;--ink2:#aaa;--line:#f2f2f2;--rule:#2a3a40;--bad:#ff6b6b;--good:#4cc16b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Mali','Noto Sans Thai',Tahoma,sans-serif;color:var(--ink);background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);display:grid;place-items:center;padding:20px 14px}
.wrap{width:min(440px,100%)}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:18px}
.brand i{display:grid;place-items:center;width:56px;height:56px;border:3px solid var(--line);border-radius:16px;background:var(--gold);color:#111;font:700 30px/1 inherit;font-style:normal;box-shadow:3px 3px 0 var(--line);transform:rotate(-4deg)}
.brand h1{margin:0;font-size:1.9rem;line-height:1.1}
.brand small{display:block;font-size:.8rem;color:var(--ink2);font-weight:400}
.box{border:3px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh);padding:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tabs button{font:inherit;font-weight:700;padding:8px;border:0;background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button+button{border-left:3px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
label{display:block;font-weight:700;margin:0 0 12px}
label span{display:block;margin-bottom:4px}
label small{font-weight:400;color:var(--ink2)}
input{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.go{width:100%;font:inherit;font-weight:700;font-size:1.05rem;padding:10px;border:3px solid var(--line);border-radius:99px;background:var(--gold);color:#111;cursor:pointer;box-shadow:3px 3px 0 var(--line);margin-top:4px}
.go:hover{background:var(--ink);color:var(--paper)}
.go[disabled]{opacity:.5;cursor:wait}
.msg{margin:0 0 12px;padding:8px 12px;border:2px solid var(--bad);border-radius:10px;background:rgba(192,18,31,.08);color:var(--bad);font-weight:600}
.msg.ok{border-color:var(--good);background:rgba(26,138,58,.1);color:var(--good)}
.msg.warn{border-color:#9a6700;background:rgba(154,103,0,.1);color:#9a6700}
.foot{text-align:center;color:var(--ink2);font-size:.85rem;margin-top:14px}
.perks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 16px;padding:0;list-style:none}
.perks li{border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:600;background:var(--panel)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><i>A</i><h1>AvastFall TCG<small>ล็อกอินเพื่อเข้าใช้งาน</small></h1></div>
  <ul class="perks"><li>🏠 หน้า Home</li><li>🛒 ร้านค้า</li><li>🃏 จัดเด็ค</li><li>🖼 แกลเลอรีการ์ด</li><li>⚔ ทดลองเล่น</li></ul>
  <div class="box">
    <div class="tabs" role="tablist"><button type="button" role="tab" id="tLogin" aria-selected="true">เข้าสู่ระบบ</button><button type="button" role="tab" id="tSign" aria-selected="false">สมัครสมาชิก</button></div>
    <div id="msg" class="msg" hidden></div>

    <form id="fLogin" autocomplete="on">
      <label><span>อีเมล หรือ ชื่อผู้ใช้</span><input id="lid" name="username" autocomplete="username" required></label>
      <label><span>รหัสผ่าน</span><input id="lpw" name="password" type="password" autocomplete="current-password" required></label>
      <button class="go" type="submit">เข้าสู่ระบบ</button>
    </form>

    <form id="fSign" autocomplete="on" hidden>
      <label><span>ชื่อผู้ใช้ <small>(3–20 ตัว · A–Z ก–๙ 0–9 _)</small></span><input id="sname" autocomplete="nickname" maxlength="20" required></label>
      <label><span>อีเมล</span><input id="smail" type="email" autocomplete="email" required></label>
      <label><span>รหัสผ่าน <small>(อย่างน้อย 8 ตัวอักษร)</small></span><input id="spw" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <button class="go" type="submit">สมัครและเข้าใช้งาน</button>
      <p class="foot" style="margin-bottom:0">สมัครใหม่รับเหรียญเริ่มต้นไปซื้อซองการ์ดได้เลย 🎁</p>
    </form>
  </div>
  <p class="foot">AvastFall TCG · Open Test</p>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // ผู้ใช้คนก่อนอาจค้างข้อมูลเด็คในเครื่อง (เครื่องร่วมกัน) — ล้างก่อนเข้าใหม่ ข้อมูลของคนที่ล็อกอินจะถูกใส่ให้จากเซิร์ฟเวอร์
  try { localStorage.removeItem('cl-decks'); } catch (e) { }
  var next = (function () { var n = new URLSearchParams(location.search).get('next') || ''; return /^\/(?!\/)[\w\-./?=&#%]*$/.test(n) ? n : ''; })();
  var busy = false;

  function say(text, kind) { var m = $('msg'); if (!text) { m.hidden = true; return; } m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : ''); m.hidden = false; }
  function tab(sign) {
    $('tLogin').setAttribute('aria-selected', String(!sign)); $('tSign').setAttribute('aria-selected', String(sign));
    $('fLogin').hidden = sign; $('fSign').hidden = !sign; say('');
    (sign ? $('sname') : $('lid')).focus();
  }
  $('tLogin').onclick = function () { tab(false); };
  $('tSign').onclick = function () { tab(true); };

  function post(url, body) {
    return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || j.message || 'ไม่สำเร็จ (' + r.status + ')'); return j; }); });
  }
  function enter() { if (next) location.replace(next); else location.reload(); }   // reload = คงลิงก์ #deck=... ที่แชร์มาไว้
  function submit(form, url, body) {
    form.addEventListener('submit', function (e) {
      e.preventDefault(); if (busy) return; busy = true; say('');
      var btn = form.querySelector('.go'), old = btn.textContent; btn.disabled = true; btn.textContent = 'กำลังดำเนินการ…';
      post(url, body()).then(function (j) {
        if (j.needConfirm) { tab(false); say('สมัครสำเร็จ! ส่งอีเมลยืนยันไปแล้ว — กดลิงก์ในอีเมลก่อน แล้วกลับมาเข้าสู่ระบบ', 'ok'); return; }
        enter();
      }).catch(function (err) { say(err.message); }).then(function () { busy = false; btn.disabled = false; btn.textContent = old; });
    });
  }
  submit($('fLogin'), '/api/auth/login', function () { return { email: $('lid').value.trim(), password: $('lpw').value }; });
  submit($('fSign'), '/api/auth/signup', function () { return { username: $('sname').value.trim(), email: $('smail').value.trim(), password: $('spw').value }; });

  fetch('/api/auth/status').then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) say('⚠ เซิร์ฟเวอร์เชื่อมฐานข้อมูลไม่สำเร็จ: ' + j.error + ' — ตรวจว่ารัน schema.sql แล้ว และคีย์ถูกต้อง', 'warn');
    else if (!j.configured) say('⚠ เซิร์ฟเวอร์ยังไม่ได้ตั้งค่า Supabase (SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY) จึงยังเข้าสู่ระบบไม่ได้', 'warn');
  }).catch(function () { });
  $('lid').focus();
})();
</script>
</body>
</html>
