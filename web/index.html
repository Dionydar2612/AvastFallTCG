<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="theme-color" content="#0a2233">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · AvastFall TCG</title>
<meta name="description" content="AvastFall TCG (Open Test) — ล็อกอินเพื่อเข้าร้านค้า จัดเด็ค ดูการ์ด และทดลองเล่นกับบอทหรือเพื่อน">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Mali:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="stylesheet" href="css/site.css?v=9"><!-- แถบเมนูเดียว Home · Decks · Cards · Shop -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/lobby.css?v=1"><!-- ธีมรวมให้เหมือนหน้า Card List (ต้องโหลดหลังสุด) -->
<style id="imgcss"></style><!-- CSS รูปการ์ด สร้างจาก URL ของ card-api (js/ui/data-sync.js) -->
</head>
<body class="shell">
<header class="site-bar" id="siteBar">
  <a class="site-brand" href="/" data-go="home" aria-label="AvastFall TCG — Home"><img class="lg" src="/assets/logo-128.png" width="44" height="44" alt=""><span>AvastFall TCG</span><em>OPEN TEST</em></a>
  <nav class="site-sw" id="siteSw" role="tablist" aria-label="เมนูหลัก" data-tab="home">
    <button role="tab" data-tab="home" aria-selected="true" id="tabHome">Home</button>
    <button role="tab" data-tab="decks" aria-selected="false" id="tabDecks" tabindex="-1">Decks</button>
    <button role="tab" data-tab="cards" aria-selected="false" id="tabCards" tabindex="-1">Cards</button>
    <button role="tab" data-tab="shop" aria-selected="false" id="tabShop" tabindex="-1">Shop</button>
    <span class="ind" aria-hidden="true"></span>
  </nav>
  <div class="site-user" id="siteUser">
    <button type="button" class="site-game" id="siteGame" hidden>▶ กลับเข้าเกม</button>
    <button type="button" class="site-chip coin" id="siteCoin" data-go="shop" title="เหรียญของคุณ — ไปร้านค้า"><i class="ic" aria-hidden="true"></i><b id="siteCoinNum">–</b></button>
    <button type="button" class="site-chip cards" id="siteCards" data-go="cards" title="การ์ดที่สะสมได้ — ไปดูการ์ด"><i class="ic" aria-hidden="true"></i><b id="siteCardsNum">–</b></button>
    <button type="button" class="site-me" id="siteMe" aria-haspopup="menu" aria-expanded="false" aria-controls="siteMenu"><span class="av" aria-hidden="true" id="siteAv">?</span><span class="nm" id="siteName">ผู้เล่น</span><svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><i class="dot" id="siteMeDot" hidden></i></button>
    <div class="site-menu" id="siteMenu" role="menu" hidden>
      <div class="who"><b id="menuName">ผู้เล่น</b><span id="menuRole" class="role">ผู้เล่น</span></div>
      <button type="button" role="menuitem" data-hdr="notes" id="hdrNotes">🔔 แจ้งเตือน · Update Note<i class="dot" id="hdrNotesDot" hidden></i></button>
      <button type="button" role="menuitem" data-hdr="feedback" id="hdrFeedback">💬 ข้อเสนอแนะ</button>
      <button type="button" role="menuitem" data-hdr="guide" id="hdrGuide">📖 วิธีเล่น</button>
      <hr>
      <button type="button" role="menuitem" class="out" id="siteOut">ออกจากระบบ</button>
    </div>
  </div>
</header>
<div class="site-view" id="siteView" data-tab="home">
  <section class="site-pane on" id="paneHub" role="tabpanel" aria-label="Home และร้านค้า"><iframe id="hubFrame" title="Home และร้านค้า" data-src="/hub.html"></iframe></section>
  <section class="site-pane" id="panePlay" role="tabpanel" aria-label="ทดลองเล่น"><div class="wrap" id="app"></div></section>
  <section class="site-pane" id="paneCards" role="tabpanel" aria-label="เด็คและการ์ด"><iframe id="cardsFrame" title="เด็คและการ์ด" data-src="/cards/?embed=1"></iframe></section>
</div>

<!-- 1) กฎและเอนจิน (ไม่แตะ DOM) -->
<script src="js/engine/engine.js"></script>

<script src="js/effects/_kit.js"></script>
<script src="js/effects/sd01.js"></script>
<script src="js/effects/sd02.js"></script>

<script src="js/effects/sd05.js"></script>

<script src="js/effects/sd07.js"></script>
<script src="js/effects/bt01.js"></script>

<!-- 3) บอท -->

<!-- 4) ข้อมูลการ์ด: snapshot สำรอง + ดึงข้อมูล/รูปจาก card-api -->
<script src="js/data/snapshot.js"></script>
<script src="js/data/cards-api.js"></script>
<script src="js/data/feedback-api.js"></script>

<!-- 5) หน้าจอ (UI) -->
<script src="js/ui/base.js"></script>
<script src="js/ui/notes.js"></script>
<script src="js/ui/data-sync.js"></script>
<script src="js/ui/decks.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/ui/mydecks.js"></script>
<script src="js/ui/guide.js"></script>
<script src="js/ui/online.js"></script>
<script src="js/ui/game.js"></script>
<script src="js/ui/modals.js"></script>
<script src="js/ui/events.js"></script>
<script src="js/ui/dnd.js"></script>
<script src="js/ui/main.js"></script>
<script src="js/site.js?v=8"></script><!-- แท็บเลื่อน ต้องโหลดหลังสุด -->
</body>
</html>
